<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&amp;family=Fredoka:wght@600;700&amp;display=swap');
      .logo-text { font-family: 'Fredoka', 'Comfortaa', 'Outfit', sans-serif; font-weight: 700; fill: #002b66; }
      .arabic-text { font-family: 'Cairo', sans-serif; font-weight: 800; fill: #002b66; }
      .b2b-text { font-family: 'Cairo', 'Fredoka', sans-serif; font-weight: 900; fill: #ffffff; }
    </style>
  </defs>

  <!-- CART & Y INTEGRATION LOGO MARK -->
  <g transform="translate(10, 15)">
    <!-- Cart Base Line & Handle in Navy Blue -->
    <path d="M 12 30 L 28 30 C 33 30, 36 33, 38 39 L 52 86 C 54 92, 59 96, 66 96 L 105 96 C 112 96, 117 91, 118 84 L 122 55" 
          fill="none" stroke="#002b66" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Basket Orange Textured Goods -->
    <g fill="#ff7000">
      <circle cx="56" cy="42" r="7" />
      <circle cx="72" cy="38" r="8" />
      <circle cx="89" cy="42" r="7.5" />
      <circle cx="50" cy="57" r="8" />
      <circle cx="68" cy="55" r="9" />
      <circle cx="86" cy="57" r="7" />
      <circle cx="102" cy="52" r="6" />
      <circle cx="60" cy="72" r="7.5" />
      <circle cx="77" cy="73" r="8" />
      <circle cx="94" cy="71" r="7" />
    </g>

    <!-- Wheels in Bright Orange -->
    <circle cx="58" cy="118" r="11" fill="#ff7000" />
    <circle cx="104" cy="118" r="11" fill="#ff7000" />
  </g>

  <!-- WORDMARK "Youmi" -->
  <g transform="translate(100, 15)">
    <!-- Y -->
    <path d="M 28 20 L 52 58 L 52 98 L 72 98 L 72 58 L 96 20 L 71 20 L 62 40 L 53 20 Z" fill="#002b66" />
    <!-- o -->
    <path d="M 132 38 C 114 38, 100 52, 100 69 C 100 86, 114 100, 132 100 C 150 100, 164 86, 164 69 C 164 52, 150 38, 132 38 Z M 132 57 C 139 57, 145 62, 145 69 C 145 76, 139 81, 132 81 C 125 81, 119 76, 119 69 C 119 62, 125 57, 132 57 Z" fill="#002b66" />
    <!-- u -->
    <path d="M 175 40 L 175 78 C 175 84, 180 88, 186 88 C 192 88, 197 84, 197 78 L 197 40 L 216 40 L 216 78 C 216 93, 203 100, 186 100 C 169 100, 156 93, 156 78 L 156 40 Z" fill="#002b66" />
    <!-- m -->
    <path d="M 226 40 L 226 98 L 244 98 L 244 62 C 248 57, 254 56, 258 60 L 258 98 L 276 98 L 276 62 C 280 57, 286 56, 290 60 L 290 98 L 308 98 L 308 56 C 308 44, 296 38, 283 42 C 275 45, 270 51, 267 55 C 263 48, 257 42, 246 42 C 238 42, 230 46, 226 53 L 226 40 Z" fill="#002b66" />
    <!-- i stem -->
    <path d="M 318 40 L 318 98 L 338 98 L 338 40 Z" fill="#002b66" fill-rule="evenodd" />
    <!-- i dot with orange core & navy ring -->
    <circle cx="328" cy="22" r="11" fill="#002b66" />
    <circle cx="328" cy="22" r="6.5" fill="#ff7000" />
  </g>

  <!-- SUBTEXT ARABIC & B2B BADGE -->
  <g transform="translate(85, 132)">
    <!-- Arabic Tagline -->
    <text x="0" y="24" class="arabic-text" font-size="25">منصة التجارة بين الشركات</text>
    <!-- B2B Badge -->
    <rect x="295" y="0" width="62" height="34" rx="10" fill="#ff7000" />
    <text x="326" y="23" class="b2b-text" font-size="18" text-anchor="middle">B2B</text>
  </g>
</svg>
